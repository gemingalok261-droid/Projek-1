name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias accretion -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 -dname "CN=Accretion, OU=Music, O=Accretion, L=Jakarta, ST=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.3 --yes 2>/dev/null || true
          git tag -d v1.4.3 2>/dev/null || true
          gh release create v1.4.3 dist/*.apk \
            --title "Accretion v1.4.3 (Lyric Crossword Ray, Bantuan Audio, Leaderboard & NFC/QR Merch Linker)" \
            --notes "### Accretion v1.4.3 - Lyric Crossword Ray, Bantuan Audio, Leaderboard & NFC/QR Merch Linker

          Pembaruan besar Accretion v1.4.3:
          - **🧩 Lyric Crossword Ray (TTS Lirik Musik)**:
            - **Ambil Data Otomatis**: Memilih 5-8 lagu acak dari playlist/library/history user beserta liriknya, lengkap dengan kurasi lagu hits Indonesia & Internasional (Bernadya, Tulus, Sheila On 7, Mahalini, Coldplay, Dewa 19, NIKI, Hindia, Queen).
            - **Soal TTS Kata Kunci**: Satu kata penting dihilangkan dari penggalan lirik lagu untuk ditebak pada kotak TTS interaktif dengan keyboard virtual terintegrasi.
            - **Bantuan Audio 3 Detik**: Klik tombol bantuan audio pada soal untuk memutar potongan 3 detik lagu pas sebelum kata kunci dinyanyikan!
            - **Kartu Skor Estetik & Share**: Setelah permainan selesai, muncul kartu skor estetik Liquid Glass yang siap di-share ke WhatsApp, TikTok, IG Story, dan X.
            - **Peringkat & Statistik Jawara TTS**: Leaderboard otomatis mencatat jumlah game, kemenangan, streak, skor, dan gelar pencapaian (*Dewa Accretion, Pujangga Lirik, Master Karaoke*).
          - **🏷️ NFC & QR Physical Merch Linker**:
            - Studio pembuatan merchandise fisik dari lagu dan lirik favoritmu.
            - 4 template estetik: **Piringan Hitam (Vinyl)**, **Poster Lirik Estetik**, **Kaset Pita Retro**, dan **Gantungan Kunci (Tag)**.
            - Generate kode QR instan untuk ditempel pada poster, kaos, atau binder.
            - Dukungan penulisan ke Tag NFC fisik langsung via Android NFC API.
          - **File APK**: Download file **Accretion.apk** (Release) atau **Accretion-debug.apk** langsung di bawah!"
