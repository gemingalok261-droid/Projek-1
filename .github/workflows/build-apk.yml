name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/accretion-release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.4 --yes 2>/dev/null || true
          git tag -d v1.4.4 2>/dev/null || true
          gh release create v1.4.4 dist/*.apk \
            --title "Accretion v1.4.4 (Streak Api di Widget & TopBar, Banner Beranda, Tab Arcade & Keystore Tetap)" \
            --notes "### Accretion v1.4.4 - Streak Api di Widget & TopBar, Banner Beranda, Tab Arcade & Keystore Tetap

          Pembaruan resmi Accretion v1.4.4:
          - **🔥 Streak Api di Widget Android**: Widget Android Home Screen bawaan (Player, Compact, Wide, Square) sekarang resmi terintegrasi dengan penghitung streak api musik ('🔥 X Hari').
          - **🔥 Lencana Api di TopAppBar Beranda**: Bilah atas Beranda kini selalu menampilkan lencana interaktif '[ 🔥 X Hari ]' yang langsung bisa diklik untuk menuju game TTS Lirik.
          - **✨ Kartu Sambutan & Streak di Paling Atas Beranda**: Banner sambutan api dipindahkan ke urutan teratas sebelum chip agar langsung terlihat tanpa tertutup atau tergeser.
          - **🎮 Tab Arcade di Navigasi Bawah**: Tab ke-4 langsung aktif di bilah navigasi bawah dengan ikon Arcade untuk akses cepat ke TTS Lirik Ray dan Merch Linker.
          - **🔑 Keystore Rilis Permanen**: Penandatanganan APK kini menggunakan keystore permanen terverifikasi sehingga update ke versi berikutnya tidak akan mengalami konflik signature."
