name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias accretion -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 -dname "CN=Accretion, OU=Music, O=Accretion, L=Jakarta, ST=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.1 --yes 2>/dev/null || true
          git tag -d v1.4.1 2>/dev/null || true
          gh release create v1.4.1 dist/*.apk \
            --title "Accretion v1.4.1 (Bug Fixes, Team Info & Player Polish)" \
            --notes "### Accretion v1.4.1 - Bug Fixes, Team Info & Player Polish

          Pembaruan resmi Accretion v1.4.1:
          - **Fix App Icon Switcher Crash**: Memperbaiki masalah crash saat memilih dan mengganti ikon aplikasi di menu Pengaturan dengan resolusi nama komponen dinamis dan error handling yang aman.
          - **Fix Tombol Antrean (Queue Button)**: Tombol antrean kini responsif dan mendukung fungsi toggle (membuka antrean jika tertutup, menutup antrean jika sedang terbuka) serta fallback animasi yang andal.
          - **Pembersihan Player Button Bubbles**: Menghapus bingkai/bubble pada tombol pemutar (Previous, Play/Pause, Next) untuk tampilan yang lebih bersih dan elegan ala Apple Music.
          - **Widget Default Metrolist**: Mengembalikan konfigurasi dan tampilan widget kembali ke standar bawaan Metrolist.
          - **Pembaruan Info Pengembang & Tim**:
            - **Pemimpin**: Antigravity (Pengembangan Utama) dengan avatar AI Antigravity.
            - **Pengembang**: Ray (@rayytampann) dengan tombol profil TikTok dan modal sponsor QRIS.
            - **Kolaborator**: Ganzvlty (@ganzvlty) dengan peran 'Mencari Bug Dan Mencari Ide' dan tautan TikTok.
            - **Tautan Komunitas**: Ikon Discord, Telegram, dan GitHub dijadikan hiasan dekoratif (tanpa redirect).
          - **File APK**: Download file **Accretion.apk** (Release) atau **Accretion-debug.apk** langsung di bawah!"
