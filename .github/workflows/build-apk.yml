name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/accretion-release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.5 --yes 2>/dev/null || true
          git tag -d v1.4.5 2>/dev/null || true
          gh release create v1.4.5 dist/*.apk \
            --title "Accretion v1.4.5 (Fix Tombol Antrean Player, Native Android Banner, Streak Api & Arcade Crossword)" \
            --notes "### Accretion v1.4.5 - Fix Tombol Antrean Player, Native Android Banner, Streak Api & Arcade Crossword

          Pembaruan resmi Accretion v1.4.5:
          - **🎵 Fix Tombol Antrean (Queue) Player**: Masalah gesture tabrakan pada baris player bottom controls telah diperbaiki tuntas. Menekan tombol antrean kini langsung merespons dan membuka lembar antrean secara responsif dan mulus.
          - **✨ Banner Sambutan & Streak Api di Android Asli**: Komponen AccretionWelcomeStreakBanner dipasang langsung ke HomeScreen.kt native Android sehingga langsung muncul di baris paling atas Beranda lengkap dengan animasi api streak dan status high FPS.
          - **🔥 Lencana Api TopAppBar Interaktif**: Lencana '🔥 X Hari' di bilah atas Beranda Android kini interaktif dan langsung membawa pengguna ke game Arcade TTS Lirik Ray.
          - **🎮 Tab Arcade Aktif di Navigasi Bawah**: Tab ke-4 (Arcade) di bilah navigasi Android kini langsung menjalankan LyricCrosswordScreen (TTS Lirik Lagu) dan MerchLinkerScreen (QR & NFC Tag fisik).
          - **🌐 Dukungan Multiplatform Penuh**: Seluruh integrasi banner, streak, antrean, dan game TTS sinkron untuk Android, Desktop (Windows, macOS, Linux), dan iOS."
