name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias accretion -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 -dname "CN=Accretion, OU=Music, O=Accretion, L=Jakarta, ST=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.0 --yes 2>/dev/null || true
          git tag -d v1.4.0 2>/dev/null || true
          gh release create v1.4.0 dist/*.apk \
            --title "Accretion v1.4.0 (Cosmic Accretion Theme & Dynamic Voidbeat Loader)" \
            --notes "### Accretion v1.4.0 - Cosmic Accretion Theme & Dynamic Voidbeat Loader

          Pembaruan resmi Accretion:
          - **Rebrand Resmi Accretion**: Seluruh identitas aplikasi diperbarui dari Projek 1 menjadi **Accretion**.
          - **Dynamic Voidbeat Accretion Loader**: Indikator loading baru terinspirasi dari disk akresi lubang hitam relativistik dengan ring equalizer spektrum audio 56-bar dan infalling cosmic particles, sepenuhnya adaptif mengikuti warna tema yang aktif.
          - **Ikon Baru Accretion**: Desain logo akresi kosmik modern dengan event horizon bercahaya, dukungan ikon dinamis Android (Material You Themed Icon), dan varian warna kustom di pengaturan.
          - **Fluid Micro-Animations**: Animasi interaktif halus dan responsif di seluruh pemutar dan navigasi.
          - **Full iOS Liquid Glass Player**: Antarmuka pemutar musik transparan ala Apple Music dengan Dynamic Island capsule miniplayer dan bilah navigasi floating dock.
          - **File APK**: Download file **Accretion.apk** (Release) atau **Accretion-debug.apk** langsung di bawah!"
