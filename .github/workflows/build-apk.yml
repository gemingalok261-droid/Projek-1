name: Build Accretion APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias accretion -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 -dname "CN=Accretion, OU=Music, O=Accretion, L=Jakarta, ST=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: accretion
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Accretion.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Accretion-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Accretion.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Accretion.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Accretion-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.4.2 --yes 2>/dev/null || true
          git tag -d v1.4.2 2>/dev/null || true
          gh release create v1.4.2 dist/*.apk \
            --title "Accretion v1.4.2 (Streak Api, High FPS, Queue Fix & Release Updates)" \
            --notes "### Accretion v1.4.2 - Streak Api, High FPS, Queue Fix & Release Updates

          Pembaruan resmi Accretion v1.4.2:
          - **Fix Tombol Antrean (Queue Button)**: Tombol antrean di pemutar musik diperbaiki secara tuntas dengan sinkronisasi posisi real-time tanpa konflik anchor state.
          - **Hapus Opsi Ganti Logo Aplikasi**: Opsi pemilihan ikon aplikasi dihapus sepenuhnya dari Pengaturan Tampilan untuk stabilitas maksimal.
          - **Fitur Streak Api Musik (🔥)**: Penghitung hari mendengarkan musik beruntun dengan kartu sambutan di beranda. Ikon api menyala membara setiap hari kamu memutar musik!
          - **Paksa FPS Tinggi (90Hz / 120Hz)**: Sakelar baru di Pengaturan Tampilan untuk memaksimalkan refresh rate layar ke mode puncak agar animasi halus lancar tanpa lag dan aman untuk perangkat.
          - **Widget 100% Default Metrolist**: Tampilan dan logika widget dikembalikan sepenuhnya sesuai kode standar bawaan repositori Metrolist.
          - **Izin Overlay Dynamic Island**: Penambahan izin \`SYSTEM_ALERT_WINDOW\` serta tombol pengaturan untuk mengizinkan tampilan Dynamic Island mengambang di atas aplikasi lain ala iPhone.
          - **Pengalihan Pembaruan Aplikasi**: Pengecekan pembaruan otomatis aplikasi dialihkan langsung ke rilis repositori \`gemingalok261-droid/Projek-1\`.
          - **Pembaruan Halaman Tentang**:
            - Avatar Antigravity & Ray diperbarui dengan gambar berkualitas tinggi terbaru.
            - Tombol TikTok berlabel ringkas 'TikTok' tanpa nama pengguna.
            - Ikon tombol sponsor diubah menjadi secangkir kopi dengan judul 'Sponsor Pengembangan'.
          - **File APK**: Download file **Accretion.apk** (Release) atau **Accretion-debug.apk** langsung di bawah!"
