name: Build Projek 1 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias projek1 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 -dname "CN=Projek1, OU=Music, O=Projek1, L=Jakarta, ST=Jakarta, C=ID"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APK (Release & Debug)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: password123
          KEY_ALIAS: projek1
          KEY_PASSWORD: password123
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8" \
            -x ":androidApp:lintVitalRelease"

      - name: Prepare APKs
        run: |
          mkdir -p dist
          find androidApp/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/Projek-1.apk \; 2>/dev/null || true
          find androidApp/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} dist/Projek-1-debug.apk \; 2>/dev/null || true
          if [ ! -f dist/Projek-1.apk ]; then
            find androidApp/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/Projek-1.apk \;
          fi
          ls -lh dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Projek-1-APKs
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.2.0 --yes 2>/dev/null || true
          git tag -d v1.2.0 2>/dev/null || true
          gh release create v1.2.0 dist/*.apk \
            --title "Projek 1 v1.2.0 (Liquid Glass & Blue Theme)" \
            --notes "### Projek 1 v1.2.0 - Liquid Glass & Blue Theme Redesign

          Pembaruan tampilan dan tema:
          - **Ikon Monokrom**: Menggantikan identitas lama dengan ikon hitam-putih yang minimalis dan elegan.
          - **Warna Aksen Biru**: Tab aktif pada bilah navigasi dan indikator menu kini menggunakan aksen biru vibrant.
          - **Widget Baru Berlatar Hitam**: Seluruh widget tampil lebih segar dengan latar belakang hitam murni (Pure Black) dan border Liquid Glass.
          - **Estetika Cairan & Liquid Glass**: Pemutar lagu dengan efek cairan getaran gelombang suara (Liquid Background) dan Wavy Scrubber, serta tombol melingkar frosted glass.
          - **File APK**: Download file **Projek-1.apk** langsung di bawah!"
